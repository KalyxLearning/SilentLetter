<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Silent Letters Game | Kalyx Learning</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef3e8;--ink:#3f4147;--mute:#6b6e75;--green:#8db06a;--blue:#1f3f8f;--tint:#f1f6ea;--line:#dfe6d6;--bad:#b3402f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2217}}
:root[data-theme="dark"]{--bg:#1b2217}
*,*:before,*:after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);font-family:Poppins,"Segoe UI",Arial,sans-serif;color:var(--ink);display:flex;justify-content:center;padding:14px}
.card{width:min(560px,100%);background:#fff;border-radius:20px;border-bottom:6px solid var(--green);padding:20px;align-self:flex-start}
.top{display:flex;justify-content:space-between;align-items:center}
.top img{height:54px}
.pill{font-size:14px;color:var(--mute);font-weight:500}
h1{font-size:clamp(24px,6vw,32px);color:var(--blue);margin:14px 0 6px}
p{line-height:1.5;margin:0 0 12px;font-size:16px}
.mute{color:var(--mute);font-size:14px}
.word{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:20px 0}
.l{font:700 clamp(28px,8vw,40px) Poppins,Arial,sans-serif;min-width:48px;height:64px;border-radius:12px;border:2px solid var(--line);background:var(--tint);color:var(--ink);cursor:pointer;padding:0 8px}
.l.sel{background:var(--blue);color:#fff;border-color:var(--blue)}
.l.ok{background:var(--green);border-color:var(--green);color:#fff}
.l.miss{background:#fff;border:3px dashed var(--green);color:var(--ink)}
.l.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.l:disabled{cursor:default}
.btn{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--blue);color:#fff;font:600 17px Poppins,Arial,sans-serif;cursor:pointer}
.btn.alt{background:var(--tint);color:var(--blue);border:2px solid var(--green);margin-top:10px}
.fb{border-left:4px solid var(--green);padding:6px 12px;margin:0 0 14px;background:var(--tint);border-radius:0 10px 10px 0}
.score{font-size:48px;font-weight:700;color:var(--blue);margin:6px 0}
button:focus-visible{outline:3px solid var(--green);outline-offset:2px}
</style></head><body><div class="card" id="app"></div>
